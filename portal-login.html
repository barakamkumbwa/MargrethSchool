<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - Margreth Pre & Primary School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="top-bar">
        <div class="container">
            <a href="https://www.instagram.com/mkumbwa_106_jr/" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i> @magreth_school</a>
            <a href="https://www.instagram.com/mkumbwa_106_jr/" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i> @magreth_school</a>
        </div>
    </div>

    <header>
        <div class="container">
            <a class="logo" href="index.html">
                <i class="fas fa-graduation-cap"></i>
                <span>Margreth School</span>
            </a>
            <button class="mobile-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-navigation">
                <span class="hamburger-lines" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <nav id="site-navigation" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="admissions/index.html">Admissions</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="portal-login-section">
        <section class="portal-login-card" aria-labelledby="portal-login-title">
            <div class="portal-login-icon" aria-hidden="true"><i class="fas fa-user-shield"></i></div>
            <h1 id="portal-login-title">School Portal</h1>
            <p class="portal-login-intro">Sign in to access your school account.</p>

            <form class="portal-login-form" id="portal-login-form">
                <div class="form-group">
                    <label for="portal-email">Email address</label>
                    <input id="portal-email" name="email" type="email" autocomplete="username" placeholder="Enter your email address" required>
                </div>
                <div class="form-group">
                    <label for="portal-password">Password</label>
                    <input id="portal-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                </div>
                <div class="portal-login-options">
                    <label class="portal-remember"><input type="checkbox" name="remember"> <span>Remember me</span></label>
                    <a href="contact.html#contact-form">Need help?</a>
                </div>
                <button type="submit" class="portal-login-submit"><i class="fas fa-lock"></i> Sign In</button>
                <p class="portal-login-status" id="portal-login-status" role="status" aria-live="polite" hidden></p>
            </form>

            <p class="portal-login-help">Need a school account? <a href="contact.html#contact-form">Contact the school</a>.</p>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.querySelector('#portal-login-form')?.addEventListener('submit', event => {
            event.preventDefault();
            const status = document.querySelector('#portal-login-status');
            status.textContent = 'Portal sign-in is not connected yet. Please contact the school for account access.';
            status.hidden = false;
        });
    </script>
</body>
</html>
